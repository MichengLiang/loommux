[package]
name = "loommux-pueue"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Loommux execution engine backed by Pueue"
repository = "https://github.com/MichengLiang/loommux"
readme = "README.md"
keywords = ["mcp", "pueue", "execution"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "loommux_pueue"
path = "src/lib.rs"

[[bin]]
name = "loommux-pueue"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.48", features = ["derive"] }
chrono = { version = "0.4.42", features = ["serde"] }
pueue-lib = { version = "=0.31.1", default-features = false, features = ["client", "log", "network", "settings"] }
regex = "1.12.2"
rmcp = { version = "=3.0.0-beta.2", default-features = false, features = ["macros", "server", "transport-io"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9.7"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }

[dev-dependencies]
proptest = "1.8.0"
tokio = { version = "1.47.1", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
strip = "symbols"
