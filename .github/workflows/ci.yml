name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv sync --group dev
      - run: uv run pytest
      - run: uv run ruff check src tests scripts/audit_pueue_engine_docs.py
      - run: uv run basedpyright src
      - run: uv build
      - run: uv run twine check dist/*

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: uv sync --group dev
      - run: sudo apt-get update && sudo apt-get install -y asciidoctor graphviz
      - name: Install frozen PlantUML
        run: |
          mkdir -p "$HOME/.local/bin" "$HOME/.local/opt/plantuml"
          curl --fail --location --retry 3 \
            --output "$HOME/.local/opt/plantuml/plantuml.jar" \
            https://github.com/plantuml/plantuml/releases/download/v1.2026.6/plantuml-1.2026.6.jar
          printf '#!/bin/sh\nexec java -jar "$HOME/.local/opt/plantuml/plantuml.jar" "$@"\n' > "$HOME/.local/bin/plantuml"
          chmod +x "$HOME/.local/bin/plantuml"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv run python scripts/audit_pueue_engine_docs.py
      - run: for document in docs/pueue-engine/*.adoc; do asciidoctor --failure-level WARN -o /dev/null "$document"; done

  pueue-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy, llvm-tools
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov,cargo-deny,just
      - uses: astral-sh/setup-uv@v7
      - run: cargo install pueue --version 4.0.4 --locked
      - run: just verify
        working-directory: engines/pueue

  pueue-engine-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo check --locked --all-features
        working-directory: engines/pueue
